providers:
  deepseek:
    type: openai
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY

  openai:
    type: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  anthropic:
    type: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY

default: deepseek
